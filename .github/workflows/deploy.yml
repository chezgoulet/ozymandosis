# Deploys over SSH with deploy/deploy.sh (backup first, health-checked rollout,
# automatic rollback). Staging follows main; production is a manual, approved run.
# Setup (docs/OPERATIONS.md): repository environments "staging" and "production"
# (production with required reviewers), each with secrets DEPLOY_HOST,
# DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target: { description: "staging or production", required: true, default: staging, type: choice, options: [staging, production] }
      ref: { description: "tag or commit (default: main)", required: false, default: "" }
permissions: { contents: read }
concurrency: { group: "deploy-${{ inputs.target || 'staging' }}", cancel-in-progress: false }

jobs:
  deploy:
    # Who may deploy to production. GitHub's required-reviewer protection rule is not
    # available on this plan for a private repository (the API refuses it with a 422
    # naming the billing plan), so the gate is an authorization list instead of an
    # approval step. It exists to keep a write-only automation account from dispatching a
    # production deploy on its own.
    #
    # Narrow the list to ["big-cookie"] to make every production deploy an explicit act by
    # the owner; widen it only with the same care as handing out admin.
    #
    # Auto-triggered runs (workflow_run on main) carry no inputs and therefore target the
    # "staging" environment, which is deliberately unconfigured and no-ops loudly.
    if: >-
      (github.event_name == 'workflow_dispatch'
        && (inputs.target != 'production'
            || contains(fromJSON('["big-cookie","robot-chezgoulet"]'), github.actor)))
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64]
    environment: ${{ inputs.target || 'staging' }}
    env: { CONFIGURED: "${{ secrets.DEPLOY_HOST != '' }}" }  # secrets cannot appear in step conditions
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        run: echo "No DEPLOY_HOST for this environment yet; nothing to deploy."
      - name: Deploy
        if: env.CONFIGURED == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          REF: ${{ inputs.ref || github.event.workflow_run.head_sha || 'origin/main' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" "cd ~/ozymandosis && deploy/deploy.sh '$REF'"
