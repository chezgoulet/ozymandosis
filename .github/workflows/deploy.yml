# Deploys one revision to production over SSH with deploy/deploy.sh: backup first,
# health-checked rollout, automatic rollback.
#
# Manual dispatch only. Nothing deploys on a push, and there is no staging
# environment in this pipeline — a test box is spun up on demand on Linode and
# destroyed afterwards (docs/DEPLOY.md, "A staging box, when you need one").
#
# Setup (docs/OPERATIONS.md): a repository environment "production" with secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
#
# ⚠️ GitHub resolves workflow_dispatch against the DEFAULT branch, so this file has
# to exist on `main`. Changing it on `testing` alone changes nothing about what runs.
name: deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tag or commit to deploy (blank = the integration branch)"
        required: false
        default: ""
permissions: { contents: read }
concurrency: { group: "deploy-production", cancel-in-progress: false }

jobs:
  deploy:
    # Who may deploy. GitHub's required-reviewer protection rule is not available on
    # this plan for a private repository (the API refuses it with a 422 naming the
    # billing plan), so the gate is an authorization list instead of an approval
    # step. Narrow it to ["big-cookie"] to make every production deploy an explicit
    # act by the owner; widen it only with the same care as handing out admin.
    if: contains(fromJSON('["big-cookie","robot-chezgoulet"]'), github.actor)
    runs-on: [self-hosted, linux, x64]
    environment: production
    env: { CONFIGURED: "${{ secrets.DEPLOY_HOST != '' }}" }  # secrets cannot appear in step conditions
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        run: echo "No DEPLOY_HOST for the production environment; nothing to deploy."
      - name: Deploy
        if: env.CONFIGURED == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          REF: ${{ inputs.ref || 'origin/testing' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$TARGET" "cd ~/ozymandosis && deploy/deploy.sh '$REF'"
