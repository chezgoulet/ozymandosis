# Cuts a client release when a release tag is pushed.
#
# One repo holds the game and the service, so one tag fires two workflows: this one
# and `deploy.yml`. Each asks tools/release-scope.cjs whether it has any work, so a
# server-only tag does not cut a client release and a client-only tag does not
# redeploy the service. See §6 of the CD review.
#
# What this does: verifies the version markers agree, verifies the tagged commit
# passed CI, builds the web bundle and the site, and publishes a GitHub Release with
# the bundle attached and the store steps written down.
#
# What it deliberately does not do: sign anything. Android, iOS and Steam builds need
# keys that are not in CI, so they stay manual and are listed in the release note.
name: release-client
on:
  push:
    tags: ['v*', 'app-v*']
permissions: { contents: write, actions: read }
concurrency: { group: "release-client-${{ github.ref_name }}", cancel-in-progress: false }

jobs:
  # These jobs run on GitHub-hosted runners. They used to be self-hosted because the org's
  # runner group was the only way to reach the server; that was never the real constraint —
  # the deploy key is, and it reaches the server from anywhere. The repository is public
  # now, so hosted minutes are free and unlimited, and the workstation stops being in the
  # path of a deploy it has nothing to do with.
  scope:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.scope.outputs.client }}
      why: ${{ steps.scope.outputs.why }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: scope
        env: { TAG: "${{ github.ref_name }}", EVENT: "${{ github.event_name }}" }
        run: node tools/release-scope.cjs >> "$GITHUB_OUTPUT"

  verified:
    needs: scope
    if: needs.scope.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The tagged commit must have passed CI
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node tools/ci-status.cjs "${{ github.repository }}" "${{ github.sha }}"

  # R6 in the open-sourcing record: build twice, diff, fail the release on any difference.
  # Two *different* directories on purpose — an APK that embeds its own build path would
  # pass a same-directory test and fail F-Droid's, which is the comparison that matters.
  # Unsigned: F-Droid compares the content it rebuilds, not our signature.
  reproducible:
    needs: [scope, verified]
    if: needs.scope.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci && node tools/build-web.cjs && npx cap sync android
      - name: The SDK pieces the build pins
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-37.0" "build-tools;34.0.0" >/dev/null
      - name: Build an unsigned release APK at two paths and compare
        run: |
          set -euo pipefail
          build() {
            local dir="$1"
            rm -rf "$dir" && mkdir -p "$dir"
            git archive HEAD | tar -x -C "$dir"
            cp -a android/capacitor-cordova-android-plugins "$dir/android/" 2>/dev/null || true
            ln -sfn "$PWD/node_modules" "$dir/node_modules"
            ( cd "$dir/android" && ./gradlew --no-daemon assembleRelease )
          }
          build /tmp/repro-a
          build /tmp/repro-b
          A=$(find /tmp/repro-a -name "*-release-unsigned.apk" | head -1)
          B=$(find /tmp/repro-b -name "*-release-unsigned.apk" | head -1)
          [ -n "$A" ] && [ -n "$B" ] || { echo "::error::no unsigned release APK was produced"; exit 1; }
          sha256sum "$A" "$B"
          cmp "$A" "$B" || { echo "::error::the APK is not reproducible: the two builds differ"; exit 1; }
          echo "reproducible: $(sha256sum "$A" | cut -d' ' -f1)"

  release:
    needs: [scope, verified, reproducible]
    if: always() && needs.scope.outputs.client == 'true' && needs.verified.result == 'success' && needs.reproducible.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    # The signing material lives in the environment. An `if:` cannot read secrets, so the
    # question is asked once here and the steps test the answer.
    env: { HAS_KEYSTORE: "${{ secrets.OZY_UPLOAD_KEYSTORE_B64 != '' }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Every place the version is written down, and the tag itself, agreeing — before
      # anything ships. Without the tag check, v9.9.9 would happily release a 0.5.1 tree.
      - name: Version markers and the tag agree
        env: { TAG: "${{ github.ref_name }}" }
        run: node tools/version-check.cjs

      - name: Build the web bundle and the site
        run: node tools/build-web.cjs

      - name: Package the web build
        env: { TAG: "${{ github.ref_name }}" }
        run: tar -czf "/tmp/ozymandosis-web-$TAG.tar.gz" -C www .

      - name: Write the release note
        env: { TAG: "${{ github.ref_name }}" }
        run: node tools/release-notes.cjs > /tmp/RELEASE.md

      # Idempotent: a re-run uploads over the same release instead of failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="/tmp/ozymandosis-web-$TAG.tar.gz"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ASSET#Ozymandosis web build (offline PWA)"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ozymandosis $TAG" \
              --notes-file /tmp/RELEASE.md \
              "$ASSET#Ozymandosis web build (offline PWA)"
          fi
          echo "released $TAG (${{ needs.scope.outputs.why }})"

      - name: The toolchain the signed APK needs
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }

      - name: The SDK pieces the APK build pins
        if: env.HAS_KEYSTORE == 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-37.0" "build-tools;34.0.0" >/dev/null

      # The web bundle is already built above, and the APK embeds it. The signature is
      # checked before anything is attached: an APK that does not verify is not published.
      - name: The signed Android APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.OZY_UPLOAD_KEYSTORE_B64 }}
          OZY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OZY_UPLOAD_KEYSTORE_PASSWORD }}
          OZY_UPLOAD_KEY_PASSWORD: ${{ secrets.OZY_UPLOAD_KEY_PASSWORD }}
          OZY_UPLOAD_KEY_ALIAS: ${{ secrets.OZY_UPLOAD_KEY_ALIAS }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export OZY_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleRelease)
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          NAME="ozymandosis-android-$TAG.apk"
          cp "$APK" "$NAME"
          printf '%s  %s\n' "$(sha256sum "$APK" | cut -d' ' -f1)" "$NAME" > "$NAME.sha256"
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
          echo "attached $NAME"
