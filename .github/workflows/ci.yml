name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test                      # game simulation and content
      - run: npm run typecheck -w apps/play
      - run: npm run play:test             # play service (in-memory Postgres)
      - run: node tools/build-web.cjs && node apps/site/build.cjs
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/play/Dockerfile -t ozymandosis-play .
      - run: docker build -f deploy/web.Dockerfile -t ozymandosis-web .
