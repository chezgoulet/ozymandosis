name: ci
# Branches only, deliberately: a release tag fires the release workflows (deploy.yml,
# release-client.yml) and re-runs nothing here.
#
# And only `testing` and `main` on push — every other branch is covered by the
# pull_request event. Running on both events meant every PR commit ran this whole
# matrix twice (measured 2026-10-06: bd561cb, 110149c, d5f1049 each had a push run and
# a pull_request run), which doubled the bill and doubled the queue for nothing.
on:
  push:
    branches: [testing, main]
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

# Where each job runs, and why it is not uniform:
#
#   test / browsers / images   GitHub-hosted (ubuntu-latest). The org's Free plan
#                              includes 2,000 Linux minutes a month for private repos
#                              and usage is already past that in a busy month
#                              (Sep 2026: 4,609 minutes), so overage costs about
#                              $0.008/min — one full run of this matrix is roughly
#                              40-60 billed minutes. The point of paying it is that
#                              the alternative is running the whole matrix on the
#                              workstation its owner is sitting at, where a red check
#                              is a function of whatever else the machine is doing.
#                              (The comment here used to say hosted runners were
#                              blocked account-wide by a billing failure. That was
#                              stale: a probe ran on the `GitHub Actions` runner group,
#                              ubuntu24 image, on 2026-10-06.)
#
#   android                    GitHub-hosted. The image carries an Android SDK; the two
#                              components this build pins are installed explicitly because
#                              a runner image is not a promise about SDK versions.
#
#   steam-linux                self-hosted. It needs a lingering PipeWire session, Xvfb
#                              and the steam package's AppArmor profile — host state a
#                              hosted runner has no equivalent of.
#
# Keeping any job self-hosted needs the runner online; `deploy` (a separate workflow)
# stays there too, because the Linode firewall only allows port 22 from known addresses.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/version-check.cjs   # the version is written down in nine places; they must agree
      - run: npm test                      # simulation, content, host audit
      - run: npm run typecheck -w apps/play
      - run: npm run play:test             # play service (in-memory Postgres)
      - run: node tools/build-web.cjs
      - run: npm audit --omit=dev --audit-level=high

  # The game in every engine players use: Chromium (Chrome, Edge, Android WebView,
  # the desktop app), Firefox, and WebKit (Safari, every iOS browser).
  browsers:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env: { BROWSER: "${{ matrix.browser }}", PW: playwright }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # --with-deps installs the system libraries each engine needs (WebKit wants
      # libavif16 among others) and needs sudo, which hosted runners have. The
      # fallback keeps this working on a runner that does not, where those libraries
      # are a one-time host prerequisite instead: sudo apt-get install -y libavif16
      - run: npx playwright install --with-deps ${{ matrix.browser }} || npx playwright install ${{ matrix.browser }}
      - run: node test/ui.smoke.cjs
      - run: node test/features.test.cjs
        env: { NOGPU: "1" }
      - run: node test/flow.test.cjs
      - run: docker pull -q coturn/coturn:4.6   # online matches are always relayed (D19): the e2e runs a real TURN server
        if: matrix.browser != 'webkit'
      - run: node test/mp.test.cjs && node test/online.test.cjs && node test/lan.test.cjs
        if: matrix.browser != 'webkit'     # headless WebKit on Linux has no loopback WebRTC
      - run: node test/frames.test.cjs
        if: matrix.browser == 'chromium'
      - run: node test/touch.test.cjs
        if: matrix.browser == 'chromium'   # touch emulation (isMobile) is Chromium-only in Playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "screens-${{ matrix.browser }}", path: "test/shots\ntest/traces", retention-days: 7 }

  # The Linux Steam build, packaged and played inside Steam Linux Runtime 3.0
  # (sniper) as Steam runs it (docs/STORES.md). Self-hosted on purpose: it needs Xvfb,
  # the runner user's lingering PipeWire session, and the steam package's AppArmor
  # profile. The runtime itself is fetched, pinned, to ~/.cache/steamrt.
  steam-linux:
    needs: test
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci && npm run package
        working-directory: apps/desktop
      - run: node test/steamrt.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: screens-steam-linux, path: test/shots, retention-days: 7 }

  # The Android app, which nothing else compiles. It is the only binary we ship, and it is
  # what F-Droid rebuilds and compares — so a break here is a break in the thing players
  # install. The toolchain is pinned in android/app/build.gradle (JDK 21, build-tools 34).
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: node tools/build-web.cjs
      - run: npx cap sync android
      - name: The SDK pieces the build pins
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-37.0" "build-tools;34.0.0" >/dev/null
      - name: Build the APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: The APK must contain no Google artifact
        # The app is free on every rail and membership is bought on the website. A stray
        # billing or integrity dependency would be both a false declaration and an F-Droid
        # rejection, so the artifact itself is checked rather than the build file alone.
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          n=$(unzip -l "$APK" | grep -icE 'billing|integrity|play-services|gms' || true)
          echo "Google entries in the APK: $n"
          [ "$n" = "0" ] || { echo "::error::a Google dependency is packaged in the APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: android-failure, path: "android/app/build/reports", retention-days: 7 }

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f apps/play/Dockerfile -t ozymandosis-play .
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f deploy/web.Dockerfile -t ozymandosis-web .
      - run: docker build -f deploy/backup.Dockerfile -t ozymandosis-backup .
