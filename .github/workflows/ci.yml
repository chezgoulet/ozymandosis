name: ci
on: [push, pull_request]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test                      # simulation, content, host audit
      - run: npm run typecheck -w apps/play
      - run: npm run play:test             # play service (in-memory Postgres)
      - run: node tools/build-web.cjs && node apps/site/build.cjs
      - run: npm audit --omit=dev --audit-level=high

  # The game in every engine players use: Chromium (Chrome, Edge, Android WebView,
  # the desktop app), Firefox, and WebKit (Safari, every iOS browser).
  browsers:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env: { BROWSER: "${{ matrix.browser }}", PW: playwright }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node test/ui.smoke.cjs
      - run: node test/features.test.cjs
        env: { NOGPU: "1" }
      - run: node test/flow.test.cjs
      - run: docker pull -q coturn/coturn:4.6   # online matches are always relayed (D19): the e2e runs a real TURN server
        if: matrix.browser != 'webkit'
      - run: node test/mp.test.cjs && node test/online.test.cjs && node test/lan.test.cjs
        if: matrix.browser != 'webkit'     # headless WebKit on Linux has no loopback WebRTC
      - run: node test/frames.test.cjs
        if: matrix.browser == 'chromium'
      - run: node test/touch.test.cjs
        if: matrix.browser == 'chromium'   # touch emulation (isMobile) is Chromium-only in Playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "screens-${{ matrix.browser }}", path: "test/shots\ntest/traces", retention-days: 7 }

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f apps/play/Dockerfile -t ozymandosis-play .
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f deploy/web.Dockerfile -t ozymandosis-web .
      - run: docker build -f deploy/backup.Dockerfile -t ozymandosis-backup .
