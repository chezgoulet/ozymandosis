name: ci
on: [push, pull_request]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

# Runs on the House's self-hosted runner, which is registered at the ORGANISATION
# level (gitHubUrl = https://github.com/chezgoulet), so it already serves this
# repo. GitHub-hosted runners are blocked account-wide by a billing failure.
#
# Runner host prerequisites, installed once, not per job:
#   - Node 22 (actions/setup-node provides it), Docker, and the Playwright
#     browser binaries under ~/.cache/ms-playwright
#   - WebKit also needs the system package `libavif16`. Until that is installed
#     the webkit leg fails to launch, and that is an environment fault rather
#     than a code fault. One command on the host fixes it:
#         sudo apt-get install -y libavif16
jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test                      # simulation, content, host audit
      - run: npm run typecheck -w apps/play
      - run: npm run play:test             # play service (in-memory Postgres)
      - run: node tools/build-web.cjs && node apps/site/build.cjs
      - run: npm audit --omit=dev --audit-level=high

  # The game in every engine players use: Chromium (Chrome, Edge, Android WebView,
  # the desktop app), Firefox, and WebKit (Safari, every iOS browser).
  browsers:
    needs: test
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env: { BROWSER: "${{ matrix.browser }}", PW: playwright }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # No --with-deps: that shells out to apt and needs sudo, which the runner
      # does not have. System libraries are a one-time host prerequisite (see the
      # note at the top); the browsers themselves live in the runner user's cache.
      - run: npx playwright install ${{ matrix.browser }}
      - run: node test/ui.smoke.cjs
      - run: node test/features.test.cjs
        env: { NOGPU: "1" }
      - run: node test/flow.test.cjs
      - run: docker pull -q coturn/coturn:4.6   # online matches are always relayed (D19): the e2e runs a real TURN server
        if: matrix.browser != 'webkit'
      - run: node test/mp.test.cjs && node test/online.test.cjs && node test/lan.test.cjs
        if: matrix.browser != 'webkit'     # headless WebKit on Linux has no loopback WebRTC
      - run: node test/frames.test.cjs
        if: matrix.browser == 'chromium'
      - run: node test/touch.test.cjs
        if: matrix.browser == 'chromium'   # touch emulation (isMobile) is Chromium-only in Playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "screens-${{ matrix.browser }}", path: "test/shots\ntest/traces", retention-days: 7 }

  # The Linux Steam build, packaged and played inside Steam Linux Runtime 3.0
  # (sniper) as Steam runs it (docs/STORES.md). Host prerequisites, once: Xvfb, the
  # runner user's PipeWire session (lingering), and the steam package's AppArmor
  # profile. The runtime itself is fetched, pinned, to ~/.cache/steamrt.
  steam-linux:
    needs: test
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci && npm run package
        working-directory: apps/desktop
      - run: node test/steamrt.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: screens-steam-linux, path: test/shots, retention-days: 7 }

  images:
    runs-on: [self-hosted, linux, x64]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f apps/play/Dockerfile -t ozymandosis-play .
      - run: docker build --build-arg REVISION=${GITHUB_SHA::7} -f deploy/web.Dockerfile -t ozymandosis-web .
      - run: docker build -f deploy/backup.Dockerfile -t ozymandosis-backup .
