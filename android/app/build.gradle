apply plugin: 'com.android.application'

// Release signing with the upload key (docs/RELEASE-ANDROID.md). The key and its
// passwords never enter git: they come from android/keystore.properties (ignored)
// or from OZY_UPLOAD_* environment variables (CI). Play App Signing holds the real
// app-signing key; this one only proves uploads come from us.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signing = { String key, String env -> System.getenv(env) ?: signingProps.getProperty(key) }
def uploadStore = signing('storeFile', 'OZY_UPLOAD_KEYSTORE')

android {
    namespace = "com.ozymandosis.game"
    // Compiled against API 37 for the local-network APIs (ACCESS_LOCAL_NETWORK, the NSD
    // picker); it still targets 36, and the 37-only calls are guarded by SDK_INT.
    compileSdkVersion "android-37.0"
    defaultConfig {
        applicationId = "com.ozymandosis.game"
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        versionCode = 500
        versionName = "0.5.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        release {
            if (uploadStore) {
                storeFile = file(uploadStore)
                storePassword = signing('storePassword', 'OZY_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias = signing('keyAlias', 'OZY_UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword = signing('keyPassword', 'OZY_UPLOAD_KEY_PASSWORD') ?: signing('storePassword', 'OZY_UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStore) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:8.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
